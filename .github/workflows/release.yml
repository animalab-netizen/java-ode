name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate tag matches pom version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -oPm1 '(?<=<version>)[^<]+' pom.xml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match pom.xml version ($PROJECT_VERSION)."
            exit 1
          fi

      - name: Compile runtime and tests
        run: |
          mkdir -p out
          javac -d out $(find src/main/java src/test/java -name "*.java")

      - name: Run assertions
        run: java -ea -cp out io.github.animalab.ode.RuntimeTest
